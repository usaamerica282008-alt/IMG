<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { margin-top: 0; font-size: 1.5rem; color: #fff; }
        label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.9rem; }
        
        textarea, input, select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-card {
            background-color: #0f172a;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .option-card.active {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.15);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .preview-box {
            background-color: #0f172a;
            border: 2px dashed var(--border);
            border-radius: 12px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 80%;
            background-color: var(--border);
            height: 6px;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--primary);
            transition: width 0.3s;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .history-item {
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .history-item canvas { width: 100%; display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- INPUT PANEL -->
    <div class="panel">
        <h2>🎨 AI Image Studio</h2>
        
        <label for="prompt">Prompt (Waan uumamuu qabu)</label>
        <textarea id="prompt" rows="3" placeholder="Fakkeenya: Futuristic neon cyberpunk cat sitting on a skyscraper..."></textarea>

        <label for="negative">Negative Prompt (Waan irratti uumamuu hin qabne)</label>
        <input type="text" id="negative" placeholder="blurry, low quality, distorted...">

        <label>Image Style (Bifoota Fakkii)</label>
        <div class="grid-options" id="style-grid"></div>

        <label>Aspect Ratio (Hanga Fakkii)</label>
        <div class="grid-options" id="ratio-grid"></div>

        <button class="btn" onclick="generateImage()">Uumi (Generate)</button>
    </div>

    <!-- OUTPUT PANEL -->
    <div class="panel">
        <h2>🖼️ Output & Preview</h2>
        <div class="preview-box" id="preview-container">
            <span id="preview-placeholder" style="color: var(--text-muted);">Fakkii uumamu asitti argama</span>
            <canvas id="main-canvas" style="display:none; max-width:100%; max-height:100%;"></canvas>
            <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; color: var(--primary);"></div>
            <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <h3>📚 Saved Gallery</h3>
        <div class="history-grid" id="gallery"></div>
    </div>
</div>

<script>
    const styles = [
        { id: 'REALISTIC', name: 'Realistic', icon: '📷', colors: ['#475569', '#334155', '#1e293b'] },
        { id: 'ANIME', name: 'Anime', icon: '🎨', colors: ['#3b82f6', '#eab308', '#ef4444'] },
        { id: 'CYBERPUNK', name: 'Cyberpunk', icon: '🌆', colors: ['#1e1b4b', '#d946ef', '#06b6d4'] },
        { id: 'WATERCOLOR', name: 'Watercolor', icon: '🖌️', colors: ['#bae6fd', '#fbcfe8', '#fef08a'] },
        { id: 'FANTASY', name: 'Fantasy', icon: '🧙‍♂️', colors: ['#4c1d95', '#ca8a04', '#0f172a'] },
        { id: 'SYNTHWAVE', name: 'Synthwave', icon: '🌅', colors: ['#1e1b4b', '#ff007f', '#00f0ff'] }
    ];

    const ratios = [
        { id: 'SQUARE', label: '1:1 Square', w: 1, h: 1 },
        { id: 'LANDSCAPE', label: '16:9 Landscape', w: 16, h: 9 },
        { id: 'PORTRAIT', label: '9:16 Portrait', w: 9, h: 16 }
    ];

    let selectedStyle = 'REALISTIC';
    let selectedRatio = 'SQUARE';

    // Render Options
    const styleGrid = document.getElementById('style-grid');
    styles.forEach(s => {
        styleGrid.innerHTML += `<div class="option-card ${s.id==='REALISTIC'?'active':''}" id="style-${s.id}" onclick="selectStyle('${s.id}')">${s.icon}<br>${s.name}</div>`;
    });

    const ratioGrid = document.getElementById('ratio-grid');
    ratios.forEach(r => {
        ratioGrid.innerHTML += `<div class="option-card ${r.id==='SQUARE'?'active':''}" id="ratio-${r.id}" onclick="selectRatio('${r.id}')">${r.label}</div>`;
    });

    function selectStyle(id) {
        document.querySelectorAll('#style-grid .option-card').forEach(e => e.classList.remove('active'));
        document.getElementById(`style-${id}`).classList.add('active');
        selectedStyle = id;
    }

    document.querySelectorAll('#style-grid .option-card').forEach(e => e.classList.remove('active'));
    document.getElementById(`style-${id}`).classList.add('active');
    selectedStyle = id;

    function selectRatio(id) {
        document.querySelectorAll('#ratio-grid .option-card').forEach(e => e.classList.remove('active'));
        document.getElementById(`ratio-${id}`).classList.add('active');
        selectedRatio = id;
    }

    function generateImage() {
        const promptText = document.getElementById('prompt').value.trim();
        if(!promptText) return alert("Maaloo jalqaba Prompt barreessi!");

        const placeholder = document.getElementById('preview-placeholder');
        const canvas = document.getElementById('main-canvas');
        const statusMsg = document.getElementById('status-msg');
        const pBar = document.getElementById('progress-bar');
        const pFill = document.getElementById('progress-fill');

        placeholder.style.display = 'none';
        canvas.style.display = 'none';
        pBar.style.display = 'block';

        const stages = [
            { msg: "Parsing prompt semantic tags...", p: 30 },
            { msg: "Applying style weights...", p: 60 },
            { msg: "Rendering canvas...", p: 90 },
            { msg: "Finalizing lighting...", p: 100 }
        ];

        let stageIdx = 0;
        const interval = setInterval(() => {
            if(stageIdx < stages.length) {
                statusMsg.innerText = stages[stageIdx].msg;
                pFill.style.width = stages[stageIdx].p + '%';
                stageIdx++;
            } else {
                clearInterval(interval);
                pBar.style.display = 'none';
                statusMsg.innerText = "";
                drawProceduralImage(canvas, promptText, selectedStyle, selectedRatio);
                canvas.style.display = 'block';
                addToGallery(promptText, selectedStyle, selectedRatio);
            }
        }, 600);
    }

    function drawProceduralImage(canvas, prompt, styleId, ratioId) {
        const ratio = ratios.find(r => r.id === ratioId);
        const style = styles.find(s => s.id === styleId);
        
        canvas.width = 400;
        canvas.height = (400 * ratio.h) / ratio.w;
        
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, style.colors[0]);
        grad.addColorStop(0.5, style.colors[1]);
        grad.addColorStop(1, style.colors[2]);
        
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "40px sans-serif";
