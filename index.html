<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMG Earning App</title>
    <!-- FontAwesome for Beautiful Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #131c2e;
            --input-bg: #1b263b;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24334d;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            min-height: 100vh;
        }

        /* Mobile App Frame Emulator */
        .app-frame {
            width: 100%;
            max-width: 480px;
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* Top Navigation Header */
        .app-header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(to right, #10b981, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-color: transparent;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-custom {
            padding: 6px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
        }

        /* Screen Wrapper */
        .app-content {
            padding: 20px;
            flex-grow: 1;
            padding-bottom: 90px; /* space for bottom navigation */
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Auth Form Elements (Login & Register) */
        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
            padding: 10px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 { margin: 0; font-size: 2rem; color: #fff; font-weight: 800; }
        .auth-header p { color: var(--text-muted); margin-top: 5px; }

        .glass-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .card-title {
            margin-top: 0; margin-bottom: 15px; font-size: 1.15rem; font-weight: 700;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 15px; background-color: var(--input-bg); border: 1px solid var(--border-color);
            color: white; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; }

        .btn-block {
            width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-success { background-color: var(--primary); color: white; }
        .btn-success:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-accent { background-color: var(--accent); color: white; }

        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-switch span { color: var(--primary); cursor: pointer; font-weight: bold; }

        /* Dashboard Wallet Layout */
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .wallet-card {
            background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 12px; text-align: center;
        }
        .wallet-card h3 { margin: 0; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        .wallet-card p { margin: 8px 0 0; font-size: 1.3rem; font-weight: bold; color: var(--primary); }

        /* Dashboard Main Icon Menu Matrix */
        .menu-matrix {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px;
        }
        .menu-item {
            background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .menu-item:hover { transform: translateY(-3px); border-color: var(--accent); }
        .menu-item i { font-size: 1.6rem; margin-bottom: 8px; display: block; }

        /* Video Arena Layout */
        .video-box {
            background-color: #000; border-radius: 12px; aspect-ratio: 16/9; display: flex;
            flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border-color); margin-bottom: 15px;
        }
        .video-box i { font-size: 3rem; color: var(--danger); cursor: pointer; }

        /* VIP Tier List Grid */
        .vip-list { display: flex; flex-direction: column; gap: 10px; }
        .vip-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--panel-bg); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 10px;
        }
        .vip-row.active { border-color: var(--warning); background: rgba(245, 158, 11, 0.05); }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; box-sizing: border-box;
        }
        .bottom-tab { text-align: center; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; flex-grow: 1; border: none; background: none; }
        .bottom-tab i { font-size: 1.3rem; display: block; margin-bottom: 4px; }
        .bottom-tab.active { color: var(--primary); font-weight: bold; }

        /* Tables & Badges for Admin View */
        .table-wrap { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block;}
        .bg-success { background: rgba(16,185,129,0.2); color: #10b981; }
        .bg-danger { background: rgba(239,68,68,0.2); color: #ef4444; }
        .bg-warning { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .admin-action-btn { border: none; padding: 4px 8px; border-radius: 4px; color: #fff; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-right: 2px;}
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- GLOBAL APP TOP BAR -->
        <header class="app-header" id="global-header" style="display: none;">
            <div class="app-logo"><i class="fa-solid fa-gem"></i> IMG EARN</div>
            <div>
                <select id="languageSelect" class="select-custom" onchange="changeLanguage()">
                    <option value="or">Afaan Oromo</option>
                    <option value="am">አማርኛ</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <!-- APP SCREENS CONTAINER -->
        <div class="app-content">

            <!-- 1. REGISTRATION SCREEN -->
            <div id="screen-register" class="screen active">
                <div class="auth-container">
                    <div class="auth-header">
                        <h1>IMG EARNING</h1>
                        <p id="reg-subtitle">Create a new account to start earning</p>
                    </div>
                    <div class="glass-card">
                        <div class="form-group">
                            <label id="reg-lbl-phone">Phone Number</label>
                            <input type="text" id="reg-phone" placeholder="09...">
                        </div>
                        <div class="form-group">
