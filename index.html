<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMG Townsuper Icon</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --success: #00a859;
            --danger: #e71d36;
            --dark: #23272a;
            --light-bg: #f6f8fa;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Ethiopic', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            padding: 10px 10px 80px 10px;
        }

        /* Top Bar Dynamic Dropdown Navigation Fix */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            position: relative;
        }

        .top-bar h1 {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
        }

        .lang-container {
            position: relative;
        }

        .lang-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-dropdown {
            display: none; /* Controlled via JS */
            position: absolute;
            top: 38px;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            width: 140px;
            z-index: 1000;
            border: 1px solid #eee;
        }

        .lang-dropdown button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: 0.2s;
        }

        .lang-dropdown button:hover {
            background: #f0f0f0;
            color: var(--primary);
        }

        /* Forms Layout & General View Container */
        .app-container {
            max-width: 450px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: #aaa;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(78, 84, 200, 0.2);
            margin-top: 5px;
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
        }

        /* Dashboard Application Control */
        #dashboard-panel {
            display: none;
        }

        .wallet-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .wallet-box {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .wallet-box h3 {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .wallet-box .amt {
            font-size: 16px;
            font-weight: 700;
        }

        .earning-stats {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
        }

        .badge {
            padding: 3px 6px;
            border-radius: 15px;
            font-size: 10px;
            background: #e5e7eb;
        }

        .badge.active {
            background: var(--success);
            color: white;
        }

        .alert-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 12px;
            color: #856404;
        }

        /* Fixed Navigation Menu Bottom Edge Placement */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            z-index: 999;
        }

        .nav-tab {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #9ca3af;
            cursor: pointer;
            width: 20%;
        }

        .nav-tab i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-tab.active {
            color: var(--primary);
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .grid-btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Toolbar Language Configuration Base -->
        <div class="top-bar">
            <h1 id="app-heading"><i class="fa-solid fa-cubes-stacked"></i> IMG Townsuper</h1>
            <div class="lang-container">
                <button class="lang-btn" onclick="toggleDropdown(event)">
                    <i class="fa-solid fa-globe"></i> <span id="active-lang">Afaan Oromoo</span> <i class="fa-solid fa-caret-down"></i>
                </button>
                <div class="lang-dropdown" id="langMenu">
                    <button onclick="setLang('om')">Afaan Oromoo</button>
                    <button onclick="setLang('am')">አማርኛ</button>
                    <button onclick="setLang('en')">English</button>
                </div>
            </div>
        </div>

        <!-- 1. AUTHENTICATION CONTAINER -->
        <div id="auth-panel">
            <!-- Register Card -->
            <div id="register-view" class="card">
                <h2 id="t-register"><i class="fa-solid fa-user-plus"></i> Galmee</h2>
                <div class="form-group">
                    <label id="l-phone">Lakkoofsa Bilbilaa</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="r-phone-in" placeholder="09...">
                    </div>
                </div>
                <div class="form-group">
                    <label id="l-pass">Jecha Iccitii</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="r-pass-in">
                    </div>
                </div>
                <div class="form-group">
