<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMG Earning App</title>
    <!-- FontAwesome for Beautiful Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #131c2e;
            --input-bg: #1b263b;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24334d;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Top Bar Settings */
        .top-nav {
            background-color: var(--panel-bg);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #10b981, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .select-custom {
            padding: 8px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .view-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Grid Structure */
        .app-layout {
            max-width: 1300px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 992px) {
            .app-layout { grid-template-columns: 2fr 1fr; }
        }

        .full-width { grid-column: 1 / -1; }

        /* Card Stylings */
        .glass-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        /* Wallet Wallet Boxes */
        .wallet-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .wallet-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .wallet-box i {
            font-size: 2.5rem;
            position: absolute;
            right: -10px;
            bottom: -10px;
            opacity: 0.1;
        }

        .wallet-box h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .wallet-box p { margin: 10px 0 0; font-size: 1.6rem; font-weight: 800; color: var(--primary); }

        /* Input & Form Controls */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); outline: none; }

        .btn-block {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-success { background-color: var(--primary); color: white; }
        .btn-success:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: #dc2626; }

        /* Task Video Section */
        .video-player-container {
            background-color: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            position: relative;
        }
        .video-player-container i { font-size: 3.5rem; color: var(--danger); cursor: pointer; transition: transform 0.2s; }
        .video-player-container i:hover { transform: scale(1.1); }

        /* VIP Tier List Matrix */
        .vip-scroll-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .vip-badge {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .vip-badge.active { border-color: var(--accent); background-color: rgba(99, 102, 241, 0.15); }
        .vip-badge.disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--danger); }

        /* Table & Admin Setup */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        th, td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 600; }
        
        .badge-status { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .bg-success-sub { background-color: rgba(16, 185, 129, 0.2); color: #10b981; }
        .bg-danger-sub { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .bg-warning-sub { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .action-icon-btn {
            border: none; padding: 6px 10px; border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <nav class="top-nav">
        <div class="app-logo"><i class="fa-solid fa-gem"></i> IMG EARNING APP</div>
        <div class="nav-controls">
            <select id="languageSelect" class="select-custom" onchange="changeLanguage()">
                <option value="or">Afaan Oromo</option>
                <option value="am">አማርኛ</option>
                <option value="en">English</option>
            </select>
            <button class="view-btn" id="toggleViewBtn" onclick="toggleView()">
                <i class="fa-solid fa-user-gear"></i> <span id="txt-view-toggle">Go to Admin</span>
            </button>
        </div>
    </nav>

    <!-- =============== USER DASHBOARD AREA =============== -->
    <div class="app-layout" id="panel-user">
        
        <!-- LEFT: WALLET, VIDEO TASK & VIP TIERS -->
        <div>
            <!-- Dashboard Info -->
            <div class="glass-card" style="margin-bottom: 25px;">
                <h2 class="card-title" id="lbl-dash"><i class="fa-solid fa-chart-pie" style="color: var(--accent);"></i> Dash Board</h2>
                <div class="wallet-container">
                    <div class="wallet-box">
                        <i class="fa-solid fa-wallet"></i>
                        <h3 id="lbl-p-wallet">Personal Wallet</h3>
                        <p id="val-p-wallet">150.00 ETB</p>
                    </div>
                    <div class="wallet-box">
                        <i class="fa-solid fa-money-bill-trend-up"></i>
                        <h3 id="lbl-i-wallet">Income Wallet</h3>
                        <p id="val-i-wallet">450.00 ETB</p>
                    </div>
                </div>
            </div>

            <!-- Task Board Area -->
            <div class="glass-card" style="margin-bottom: 25px;">
                <h2 class="card-title" id="lbl-task-heading"><i class="fa-solid fa-circle-play" style="color: var(--danger);"></i> Task Arena (5 Videos)</h2>
                <div class="video-player-container">
                    <i class="fa-solid fa-circle-play" onclick="playTaskVideo()"></i>
